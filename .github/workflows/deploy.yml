name: Build & Deploy to ECR

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      reason:
        description: '手動觸發原因'
        required: false
        default: '手動部署'

permissions:
  id-token: write   # OIDC token
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID || '307067291720' }}
  AWS_ROLE_ARN: ${{ format('arn:aws:iam::{0}:role/{1}', vars.AWS_ACCOUNT_ID || '307067291720', 'github-actions-line-report-deploy') }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'line-report' }}
  CPU_ARCHITECTURE: arm64
  IMAGE_PLATFORM: linux/arm64

jobs:
  build-and-deploy:
    name: Build Image And Deploy Stacks
    runs-on: ubuntu-latest

    outputs:
      version_tag: ${{ steps.tags.outputs.version_tag }}
      sha_tag: ${{ steps.tags.outputs.sha_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image tags
        id: tags
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION_TAG="${GITHUB_REF_NAME}"
          else
            DATE=$(date -u +%Y%m%d)
            VERSION_TAG="ci-${DATE}-${{ github.run_number }}"
          fi
          SHA_TAG="sha-$(echo '${{ github.sha }}' | cut -c1-7)"
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "VERSION_TAG=${VERSION_TAG}" >> "$GITHUB_ENV"
          echo "SHA_TAG=${SHA_TAG}" >> "$GITHUB_ENV"
          echo "生成版本 tag: ${VERSION_TAG}  SHA tag: ${SHA_TAG}"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-LineReport

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_PLATFORM: ${{ env.IMAGE_PLATFORM }}
        run: |
          IMAGE_BASE="${ECR_REGISTRY}/${ECR_REPOSITORY}"
          echo "IMAGE_BASE=${IMAGE_BASE}" >> "$GITHUB_ENV"
          docker buildx build --platform "${IMAGE_PLATFORM}" \
            -t "${IMAGE_BASE}:${VERSION_TAG}" \
            -t "${IMAGE_BASE}:${SHA_TAG}" \
            --push \
            .
          echo "Build 完成：${IMAGE_BASE}:${VERSION_TAG} 及 ${IMAGE_BASE}:${SHA_TAG} (${IMAGE_PLATFORM})"

      - name: Install root dependencies
        run: npm ci

      - name: Install IaC dependencies
        working-directory: iac
        run: npm ci

      - name: Deploy stacks through guarded entrypoint
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          IMAGE_TAG: ${{ env.VERSION_TAG }}
          CPU_ARCHITECTURE: ${{ env.CPU_ARCHITECTURE }}
          ALARM_EMAIL: ${{ vars.ALARM_EMAIL }}
          DEBUG_EMAIL: ${{ vars.DEBUG_EMAIL }}
          ENABLE_DEBUG_OUTCOME_NOTICES: ${{ vars.ENABLE_DEBUG_OUTCOME_NOTICES || 'true' }}
        run: |
          node scripts/cdk-deploy.js \
            LineReportMonitoringStack \
            LineReportEcsStack \
            LineReportSchedulerStack

  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: always()
    steps:
      - name: Print deployment summary
        run: |
          echo "## 部署摘要" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| 項目 | 值 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version Tag | \`${{ needs.build-and-deploy.outputs.version_tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SHA Tag | \`${{ needs.build-and-deploy.outputs.sha_tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Deployment Path | \`node scripts/cdk-deploy.js\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered by | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
